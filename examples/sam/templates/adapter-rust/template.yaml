AWSTemplateFormatVersion: "2010-09-09"
Transform:
  - AWS::Serverless-2016-10-31
  - KhoneGateway
Description: Khone Rust adapter example (adapter target + LMI gateway)

Parameters:
  GatewayCapacityProviderArn:
    Type: String
    AllowedPattern: '^arn:aws[a-zA-Z-]*:lambda:[a-z0-9-]+:[0-9]{12}:capacity-provider:[a-zA-Z0-9-_]+$'
    ConstraintDescription: Must be a Lambda capacity provider ARN in capacity-provider:<name> form.
    Description: ARN of an existing Lambda Managed Instances capacity provider for the gateway function.
  OtelTracesEndpoint:
    Type: String
    Default: ""
    Description: Optional OTLP traces endpoint URL. Leave empty to disable OTEL export.
  OtelTracesProtocol:
    Type: String
    Default: http/protobuf
    AllowedValues:
      - http/protobuf
      - grpc
    Description: OTLP protocol to use for exporting traces.

Conditions:
  OtelEnabled: !Not [!Equals [!Ref OtelTracesEndpoint, ""]]

Globals:
  Function:
    Tracing: Active
    LoggingConfig:
      ApplicationLogLevel: INFO
      LogFormat: JSON

Resources:
  AdapterRustBufferedFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: rust-cargolambda
    Properties:
      CodeUri: ../../lambda/adapter-rust/
      Handler: bootstrap
      Runtime: provided.al2023
      PackageType: Zip
      FunctionName: !Sub '${AWS::StackName}-adapter-rust-buffered'
      Description: Adapter, Mode B Rust target using buffered invoke.
      Architectures:
        - arm64
      MemorySize: 256
      Timeout: 10

  GatewayService:
    Type: Khone::Gateway::Service
    Properties:
      CapacityProviderArn: !Ref GatewayCapacityProviderArn
      FunctionName: !Sub '${AWS::StackName}-gateway'
      Description: Khone router running on Lambda Managed Instances.
      MemorySize: 2048
      Timeout: 30
      ExecutionEnvironmentMemoryGiBPerVCpu: 2.0
      PerExecutionEnvironmentMaxConcurrency: 64
      MinExecutionEnvironments: 1
      MaxExecutionEnvironments: 4
      Environment:
        RUST_LOG: info
        KHONE_OBSERVABILITY_VENDOR: !If [OtelEnabled, AWSXRAY, !Ref AWS::NoValue]
        OTEL_PROPAGATORS: !If [OtelEnabled, "xray,tracecontext,baggage", !Ref AWS::NoValue]
        OTEL_METRICS_EXPORTER: !If [OtelEnabled, "none", !Ref AWS::NoValue]
        OTEL_SERVICE_NAME: !If [OtelEnabled, !Sub '${AWS::StackName}-gateway', !Ref AWS::NoValue]
        OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: !If [OtelEnabled, !Ref OtelTracesEndpoint, !Ref AWS::NoValue]
        OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: !If [OtelEnabled, !Ref OtelTracesProtocol, !Ref AWS::NoValue]
      ConfigPrefix: !Sub 'khone/${AWS::StackName}/gateway/'
      GatewayConfig:
        DefaultTimeoutMs: 2000
      Spec:
        openapi: 3.0.0
        info:
          title: Khone Rust adapter example
          version: "1"
        paths:
          /adapter/rust/{greeting}:
            get:
              x-target-lambda: !GetAtt AdapterRustBufferedFunction.Arn
              x-khone:
                maxWaitMs: 25
                maxBatchSize: 4
                invokeMode: buffered
                timeoutMs: 8000

Outputs:
  AdapterRustBufferedFunctionArn:
    Value: !GetAtt AdapterRustBufferedFunction.Arn
  GatewayFunctionUrl:
    Value: !GetAtt GatewayServiceKhoneFunctionUrl.FunctionUrl
  GatewayServiceConfigS3Uri:
    Value: !GetAtt GatewayServiceKhoneConfigPublisher.ConfigS3Uri
  AdapterRustBufferedUrl:
    Value: !Sub "${GatewayServiceKhoneFunctionUrl.FunctionUrl}adapter/rust/hello"
