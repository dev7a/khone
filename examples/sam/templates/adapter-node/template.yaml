AWSTemplateFormatVersion: "2010-09-09"
Transform:
  - AWS::Serverless-2016-10-31
  - KhoneGateway
Description: Khone Node adapter example (adapter targets + LMI gateway)

Parameters:
  GatewayCapacityProviderArn:
    Type: String
    AllowedPattern: '^arn:aws[a-zA-Z-]*:lambda:[a-z0-9-]+:[0-9]{12}:capacity-provider:[a-zA-Z0-9-_]+$'
    ConstraintDescription: Must be a Lambda capacity provider ARN in capacity-provider:<name> form.
    Description: ARN of an existing Lambda Managed Instances capacity provider for the gateway function.
  OtelTracesEndpoint:
    Type: String
    Default: ""
    Description: Optional OTLP traces endpoint URL. Leave empty to disable OTEL export.
  OtelTracesProtocol:
    Type: String
    Default: http/protobuf
    AllowedValues:
      - http/protobuf
      - grpc
    Description: OTLP protocol to use for exporting traces.

Conditions:
  OtelEnabled: !Not [!Equals [!Ref OtelTracesEndpoint, ""]]

Globals:
  Function:
    Runtime: nodejs24.x
    Handler: app.handler
    Timeout: 10
    MemorySize: 256
    Tracing: Active
    LoggingConfig:
      ApplicationLogLevel: INFO
      LogFormat: JSON

Resources:
  AdapterNodeBufferedFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../../lambda/buffering-adapter/
      FunctionName: !Sub '${AWS::StackName}-adapter-node-buffered'
      Description: Adapter, Mode B Node target using buffered invoke.
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - app.ts
        External:
          - "@aws-sdk/*"
        Format: cjs
        Minify: false
        Sourcemap: false
        Target: es2020

  AdapterNodeStreamingFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../../lambda/streaming-adapter/
      FunctionName: !Sub '${AWS::StackName}-adapter-node-streaming'
      Description: Adapter, Mode B Node target using response streaming.
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - app.ts
        External:
          - "@aws-sdk/*"
        Format: cjs
        Minify: false
        Sourcemap: false
        Target: es2020

  AdapterNodeSseFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../../lambda/streaming-adapter-sse/
      FunctionName: !Sub '${AWS::StackName}-adapter-node-sse'
      Description: Adapter, Mode B Node target using interleaved SSE response streaming.
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - app.ts
        External:
          - "@aws-sdk/*"
        Format: cjs
        Minify: false
        Sourcemap: false
        Target: es2020

  GatewayService:
    Type: Khone::Gateway::Service
    Properties:
      CapacityProviderArn: !Ref GatewayCapacityProviderArn
      FunctionName: !Sub '${AWS::StackName}-gateway'
      Description: Khone router running on Lambda Managed Instances.
      MemorySize: 2048
      Timeout: 30
      ExecutionEnvironmentMemoryGiBPerVCpu: 2.0
      PerExecutionEnvironmentMaxConcurrency: 64
      MinExecutionEnvironments: 1
      MaxExecutionEnvironments: 4
      Environment:
        RUST_LOG: info
        KHONE_OBSERVABILITY_VENDOR: !If [OtelEnabled, AWSXRAY, !Ref AWS::NoValue]
        OTEL_PROPAGATORS: !If [OtelEnabled, "xray,tracecontext,baggage", !Ref AWS::NoValue]
        OTEL_METRICS_EXPORTER: !If [OtelEnabled, "none", !Ref AWS::NoValue]
        OTEL_SERVICE_NAME: !If [OtelEnabled, !Sub '${AWS::StackName}-gateway', !Ref AWS::NoValue]
        OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: !If [OtelEnabled, !Ref OtelTracesEndpoint, !Ref AWS::NoValue]
        OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: !If [OtelEnabled, !Ref OtelTracesProtocol, !Ref AWS::NoValue]
      ConfigPrefix: !Sub 'khone/${AWS::StackName}/gateway/'
      GatewayConfig:
        DefaultTimeoutMs: 2000
      Spec:
        openapi: 3.0.0
        info:
          title: Khone Node adapter example
          version: "1"
        paths:
          /adapter/node/buffered/{greeting}:
            get:
              x-target-lambda: !GetAtt AdapterNodeBufferedFunction.Arn
              x-khone:
                maxWaitMs: 25
                maxBatchSize: 4
                invokeMode: buffered
                timeoutMs: 8000
          /adapter/node/streaming/{greeting}:
            get:
              x-target-lambda: !GetAtt AdapterNodeStreamingFunction.Arn
              x-khone:
                maxWaitMs: 25
                maxBatchSize: 4
                invokeMode: response_stream
                timeoutMs: 8000
          /adapter/node/sse:
            get:
              x-target-lambda: !GetAtt AdapterNodeSseFunction.Arn
              x-khone:
                maxWaitMs: 25
                maxBatchSize: 4
                invokeMode: response_stream
                timeoutMs: 8000

Outputs:
  AdapterNodeBufferedFunctionArn:
    Value: !GetAtt AdapterNodeBufferedFunction.Arn
  AdapterNodeStreamingFunctionArn:
    Value: !GetAtt AdapterNodeStreamingFunction.Arn
  AdapterNodeSseFunctionArn:
    Value: !GetAtt AdapterNodeSseFunction.Arn
  GatewayFunctionUrl:
    Value: !GetAtt GatewayServiceKhoneFunctionUrl.FunctionUrl
  GatewayServiceConfigS3Uri:
    Value: !GetAtt GatewayServiceKhoneConfigPublisher.ConfigS3Uri
  AdapterNodeBufferedUrl:
    Value: !Sub "${GatewayServiceKhoneFunctionUrl.FunctionUrl}adapter/node/buffered/hello"
  AdapterNodeStreamingUrl:
    Value: !Sub "${GatewayServiceKhoneFunctionUrl.FunctionUrl}adapter/node/streaming/hello"
  AdapterNodeSseUrl:
    Value: !Sub "${GatewayServiceKhoneFunctionUrl.FunctionUrl}adapter/node/sse"
