AWSTemplateFormatVersion: "2010-09-09"
Transform:
  - AWS::Serverless-2016-10-31
  - KhoneGateway
Description: Khone Node native batch example (native batch targets + LMI gateway)

Parameters:
  GatewayCapacityProviderArn:
    Type: String
    AllowedPattern: '^arn:aws[a-zA-Z-]*:lambda:[a-z0-9-]+:[0-9]{12}:capacity-provider:[a-zA-Z0-9-_]+$'
    ConstraintDescription: Must be a Lambda capacity provider ARN in capacity-provider:<name> form.
    Description: ARN of an existing Lambda Managed Instances capacity provider for the gateway function.
  OtelTracesEndpoint:
    Type: String
    Default: ""
    Description: Optional OTLP traces endpoint URL. Leave empty to disable OTEL export.
  OtelTracesProtocol:
    Type: String
    Default: http/protobuf
    AllowedValues:
      - http/protobuf
      - grpc
    Description: OTLP protocol to use for exporting traces.

Conditions:
  OtelEnabled: !Not [!Equals [!Ref OtelTracesEndpoint, ""]]

Globals:
  Function:
    Runtime: nodejs24.x
    Handler: app.handler
    Timeout: 10
    MemorySize: 256
    Tracing: Active
    LoggingConfig:
      ApplicationLogLevel: INFO
      LogFormat: JSON

Resources:
  NativeBatchNodeBufferedFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../../lambda/buffering-simple/
      FunctionName: !Sub '${AWS::StackName}-native-batch-node-buffered'
      Description: Native batch, Mode C Node target using buffered invoke.
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - app.ts
        External:
          - "@aws-sdk/*"
        Format: cjs
        Minify: false
        Sourcemap: false
        Target: es2020

  NativeBatchNodeStreamingFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../../lambda/streaming-simple/
      FunctionName: !Sub '${AWS::StackName}-native-batch-node-streaming'
      Description: Native batch, Mode C Node target using response streaming.
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - app.ts
        External:
          - "@aws-sdk/*"
        Format: cjs
        Minify: false
        Sourcemap: false
        Target: es2020

  GatewayService:
    Type: Khone::Gateway::Service
    Properties:
      ConfigPrefix: !Sub 'khone/${AWS::StackName}/gateway/'
      GatewayConfig:
        DefaultTimeoutMs: 2000
      Spec:
        openapi: 3.0.0
        info:
          title: Khone Node native batch example
          version: "1"
        paths:
          /native-batch/node/buffered/{greeting}:
            get:
              x-target-lambda: !GetAtt NativeBatchNodeBufferedFunction.Arn
              x-khone:
                maxWaitMs: 25
                maxBatchSize: 4
                invokeMode: buffered
                timeoutMs: 8000
          /native-batch/node/adaptive/{greeting}:
            get:
              x-target-lambda: !GetAtt NativeBatchNodeBufferedFunction.Arn
              x-khone:
                maxWaitMs: 100
                maxBatchSize: 16
                invokeMode: buffered
                timeoutMs: 8000
                dynamicWait:
                  minWaitMs: 1
                  targetRps: 50
                  steepness: 0.05
                  samplingIntervalMs: 100
                  smoothingSamples: 5
          /native-batch/node/target-aware/{greeting}:
            get:
              x-target-lambda: !GetAtt NativeBatchNodeBufferedFunction.Arn
              x-khone:
                maxWaitMs: 2000
                maxBatchSize: 16
                invokeMode: buffered
                timeoutMs: 8000
                durationWait:
                  fraction: 0.5
                  minWaitMs: 0
                  probeIntervalMs: 30000
                  probeJitterMs: 1000
                  smoothingSamples: 10
                  warmupProbes: 1
          /native-batch/node/streaming/{greeting}:
            get:
              x-target-lambda: !GetAtt NativeBatchNodeStreamingFunction.Arn
              x-khone:
                maxWaitMs: 25
                maxBatchSize: 4
                invokeMode: response_stream
                timeoutMs: 8000

  GatewayFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: rust-cargolambda
    Properties:
      CodeUri: ../../../../gateway
      Handler: bootstrap
      Runtime: provided.al2023
      PackageType: Zip
      FunctionName: !Sub '${AWS::StackName}-gateway'
      Description: Khone router running on Lambda Managed Instances.
      Architectures:
        - arm64
      MemorySize: 2048
      Timeout: 30
      CapacityProviderConfig:
        Arn: !Ref GatewayCapacityProviderArn
        ExecutionEnvironmentMemoryGiBPerVCpu: 2.0
        PerExecutionEnvironmentMaxConcurrency: 64
      FunctionScalingConfig:
        MinExecutionEnvironments: 1
        MaxExecutionEnvironments: 4
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: RESPONSE_STREAM
      Environment:
        Variables:
          RUST_LOG: info
          KHONE_CONFIG_URI: !GetAtt GatewayService.ConfigS3Uri
          KHONE_OBSERVABILITY_VENDOR: !If [OtelEnabled, AWSXRAY, !Ref AWS::NoValue]
          OTEL_PROPAGATORS: !If [OtelEnabled, "xray,tracecontext,baggage", !Ref AWS::NoValue]
          OTEL_METRICS_EXPORTER: !If [OtelEnabled, "none", !Ref AWS::NoValue]
          OTEL_SERVICE_NAME: !If [OtelEnabled, !Sub '${AWS::StackName}-gateway', !Ref AWS::NoValue]
          OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: !If [OtelEnabled, !Ref OtelTracesEndpoint, !Ref AWS::NoValue]
          OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: !If [OtelEnabled, !Ref OtelTracesProtocol, !Ref AWS::NoValue]
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Sid: ReadGatewayConfig
              Effect: Allow
              Action: s3:GetObject
              Resource: !Sub
                - 'arn:${AWS::Partition}:s3:::${Bucket}/${Prefix}*'
                - Bucket: !GetAtt GatewayService.BucketName
                  Prefix: !GetAtt GatewayService.Prefix
            - Sid: InvokeTargetLambdas
              Effect: Allow
              Action:
                - lambda:InvokeFunction
                - lambda:InvokeWithResponseStream
              Resource:
                - !GetAtt NativeBatchNodeBufferedFunction.Arn
                - !GetAtt NativeBatchNodeStreamingFunction.Arn

Outputs:
  NativeBatchNodeBufferedFunctionArn:
    Value: !GetAtt NativeBatchNodeBufferedFunction.Arn
  NativeBatchNodeStreamingFunctionArn:
    Value: !GetAtt NativeBatchNodeStreamingFunction.Arn
  GatewayFunctionUrl:
    Value: !GetAtt GatewayFunctionUrl.FunctionUrl
  GatewayServiceConfigS3Uri:
    Value: !GetAtt GatewayService.ConfigS3Uri
  NativeBatchNodeBufferedUrl:
    Value: !Sub "${GatewayFunctionUrl.FunctionUrl}native-batch/node/buffered/hello"
  NativeBatchNodeAdaptiveUrl:
    Value: !Sub "${GatewayFunctionUrl.FunctionUrl}native-batch/node/adaptive/hello"
  NativeBatchNodeTargetAwareUrl:
    Value: !Sub "${GatewayFunctionUrl.FunctionUrl}native-batch/node/target-aware/hello"
  NativeBatchNodeStreamingUrl:
    Value: !Sub "${GatewayFunctionUrl.FunctionUrl}native-batch/node/streaming/hello"
