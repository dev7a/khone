AWSTemplateFormatVersion: "2010-09-09"
Transform:
  - AWS::Serverless-2016-10-31
  - KhoneGateway
Description: Khone demo (Lambda Managed Instances gateway + sample Lambda batch handlers)

Parameters:
  KhoneLayerArm64Arn:
    Type: String
    Description: ARN of the shared arm64 Mode A runtime API proxy layer (for example from bootstrap output KhoneLayerArm64Arn).
  GatewayCapacityProviderArn:
    Type: String
    AllowedPattern: '^arn:aws[a-zA-Z-]*:lambda:[a-z0-9-]+:[0-9]{12}:capacity-provider:[a-zA-Z0-9-_]+$'
    ConstraintDescription: Must be a Lambda capacity provider ARN in capacity-provider:<name> form.
    Description: ARN of an existing Lambda Managed Instances capacity provider for the gateway function.
  OtelTracesEndpoint:
    Type: String
    Default: ""
    Description: Optional OTLP traces endpoint URL (used as-is, not modified by the gateway). Leave empty to disable OTEL export.
  OtelTracesProtocol:
    Type: String
    Default: http/protobuf
    AllowedValues:
      - http/protobuf
      - grpc
    Description: OTLP protocol to use for exporting traces.

Conditions:
  OtelEnabled: !Not [!Equals [!Ref OtelTracesEndpoint, ""]]

Globals:
  Function:
    Runtime: nodejs24.x
    Handler: app.handler
    Timeout: 10
    MemorySize: 256
    Tracing: Active
    LoggingConfig:
      ApplicationLogLevel: INFO
      LogFormat: JSON

Resources:
  SampleBufferingSimpleHelloFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/buffering-simple/
      FunctionName: !Sub '${AWS::StackName}-buffering-simple-hello'
      Description: Demo batch handler (buffered, simple).
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - app.ts
        External:
          - "@aws-sdk/*"
        Format: cjs
        Minify: false
        Sourcemap: false
        Target: es2020

  SampleBufferingDynamicHelloFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/buffering-dynamic/
      FunctionName: !Sub '${AWS::StackName}-buffering-dynamic-hello'
      Description: Demo batch handler (buffered, dynamic).
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - app.ts
        External:
          - "@aws-sdk/*"
        Format: cjs
        Minify: false
        Sourcemap: false
        Target: es2020

  SampleStreamingSimpleHelloFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/streaming-simple/
      FunctionName: !Sub '${AWS::StackName}-streaming-simple-hello'
      Description: Demo batch handler (streaming, simple).
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - app.ts
        External:
          - "@aws-sdk/*"
        Format: cjs
        Minify: false
        Sourcemap: false
        Target: es2020

  SampleStreamingDynamicHelloFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/streaming-dynamic/
      FunctionName: !Sub '${AWS::StackName}-streaming-dynamic-hello'
      Description: Demo batch handler (streaming, dynamic).
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - app.ts
        External:
          - "@aws-sdk/*"
        Format: cjs
        Minify: false
        Sourcemap: false
        Target: es2020

  SampleBufferingAdapterHelloFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/buffering-adapter/
      FunctionName: !Sub '${AWS::StackName}-buffering-adapter-hello'
      Description: Demo batch handler (buffered, adapter).
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - app.ts
        External:
          - "@aws-sdk/*"
        Format: cjs
        Minify: false
        Sourcemap: false
        Target: es2020

  SampleStreamingAdapterHelloFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/streaming-adapter/
      FunctionName: !Sub '${AWS::StackName}-streaming-adapter-hello'
      Description: Demo batch handler (streaming, adapter).
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - app.ts
        External:
          - "@aws-sdk/*"
        Format: cjs
        Minify: false
        Sourcemap: false
        Target: es2020

  SampleStreamingAdapterSseFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/streaming-adapter-sse/
      FunctionName: !Sub '${AWS::StackName}-streaming-adapter-sse'
      Description: Demo batch handler (streaming, adapter, SSE).
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - app.ts
        External:
          - "@aws-sdk/*"
        Format: cjs
        Minify: false
        Sourcemap: false
        Target: es2020

  SampleStreamingModeALayerProxyPythonHelloFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.14
      CodeUri: lambda/streaming-mode-a-layer-proxy-python/
      FunctionName: !Sub '${AWS::StackName}-layer-proxy-python-hello'
      Description: Demo handler (streaming, Mode A, layer proxy, Python).
      Architectures:
        - arm64
      Layers:
        - !Ref KhoneLayerArm64Arn
      Environment:
        Variables:
          AWS_LAMBDA_EXEC_WRAPPER: /opt/khone/exec-wrapper.sh
          KHONE_MAX_CONCURRENCY: "4"

  SampleStreamingModeALayerProxyNodeHelloFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/streaming-mode-a-layer-proxy-node/
      FunctionName: !Sub '${AWS::StackName}-layer-proxy-node-hello'
      Description: Demo handler (streaming, Mode A, layer proxy, Node).
      Architectures:
        - arm64
      Layers:
        - !Ref KhoneLayerArm64Arn
      Environment:
        Variables:
          AWS_LAMBDA_EXEC_WRAPPER: /opt/khone/exec-wrapper.sh
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - app.ts
        External:
          - "@aws-sdk/*"
        Format: cjs
        Minify: false
        Sourcemap: false
        Target: es2020

  GatewayService:
    Type: Khone::Gateway::Service
    Properties:
      ConfigPrefix: !Sub 'khone/${AWS::StackName}/gateway/'
      GatewayConfig:
        DefaultTimeoutMs: 2000
      Spec:
        openapi: 3.0.0
        info:
          title: Khone demo
          version: "1"
        paths:
          /buffering/simple/{greeting}:
            get:
              x-target-lambda: !GetAtt SampleBufferingSimpleHelloFunction.Arn
              x-khone:
                maxWaitMs: 25
                maxBatchSize: 4
                invokeMode: buffered
                timeoutMs: 8000
          /buffering/dynamic/{greeting}:
            get:
              x-target-lambda: !GetAtt SampleBufferingDynamicHelloFunction.Arn
              x-khone:
                maxWaitMs: 100
                maxBatchSize: 16
                invokeMode: buffered
                timeoutMs: 8000
                dynamicWait:
                  minWaitMs: 1
                  targetRps: 50
                  steepness: 0.05
                  samplingIntervalMs: 100
                  smoothingSamples: 5
          /buffering/duration/{greeting}:
            get:
              x-target-lambda: !GetAtt SampleBufferingSimpleHelloFunction.Arn
              x-khone:
                maxWaitMs: 2000
                maxBatchSize: 16
                invokeMode: buffered
                timeoutMs: 8000
                durationWait:
                  fraction: 0.5
                  minWaitMs: 0
                  probeIntervalMs: 30000
                  probeJitterMs: 1000
                  smoothingSamples: 10
                  warmupProbes: 1
          /streaming/simple/{greeting}:
            get:
              x-target-lambda: !GetAtt SampleStreamingSimpleHelloFunction.Arn
              x-khone:
                maxWaitMs: 25
                maxBatchSize: 4
                invokeMode: response_stream
                timeoutMs: 8000
          /streaming/dynamic/{greeting}:
            get:
              x-target-lambda: !GetAtt SampleStreamingDynamicHelloFunction.Arn
              x-khone:
                maxWaitMs: 100
                maxBatchSize: 16
                invokeMode: response_stream
                timeoutMs: 8000
                dynamicWait:
                  minWaitMs: 1
                  targetRps: 50
                  steepness: 0.05
                  samplingIntervalMs: 100
                  smoothingSamples: 5
          /buffering/adapter/{greeting}:
            get:
              x-target-lambda: !GetAtt SampleBufferingAdapterHelloFunction.Arn
              x-khone:
                maxWaitMs: 25
                maxBatchSize: 4
                invokeMode: buffered
                timeoutMs: 8000
          /streaming/adapter/{greeting}:
            get:
              x-target-lambda: !GetAtt SampleStreamingAdapterHelloFunction.Arn
              x-khone:
                maxWaitMs: 25
                maxBatchSize: 4
                invokeMode: response_stream
                timeoutMs: 8000
          /streaming/adapter/sse:
            get:
              x-target-lambda: !GetAtt SampleStreamingAdapterSseFunction.Arn
              x-khone:
                maxWaitMs: 25
                maxBatchSize: 4
                invokeMode: response_stream
                timeoutMs: 8000
          /streaming/mode-a/python/{greeting}:
            get:
              x-target-lambda: !GetAtt SampleStreamingModeALayerProxyPythonHelloFunction.Arn
              x-khone:
                maxWaitMs: 25
                maxBatchSize: 4
                invokeMode: response_stream
                timeoutMs: 8000
          /streaming/mode-a/node/{greeting}:
            get:
              x-target-lambda: !GetAtt SampleStreamingModeALayerProxyNodeHelloFunction.Arn
              x-khone:
                maxWaitMs: 25
                maxBatchSize: 4
                invokeMode: response_stream
                timeoutMs: 8000

  GatewayFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: rust-cargolambda
    Properties:
      CodeUri: ../../gateway
      Handler: bootstrap
      Runtime: provided.al2023
      PackageType: Zip
      FunctionName: !Sub '${AWS::StackName}-gateway'
      Description: Khone router running on Lambda Managed Instances.
      Architectures:
        - arm64
      MemorySize: 2048
      Timeout: 30
      CapacityProviderConfig:
        Arn: !Ref GatewayCapacityProviderArn
        ExecutionEnvironmentMemoryGiBPerVCpu: 2.0
        PerExecutionEnvironmentMaxConcurrency: 64
      FunctionScalingConfig:
        MinExecutionEnvironments: 1
        MaxExecutionEnvironments: 4
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: RESPONSE_STREAM
      Environment:
        Variables:
          RUST_LOG: info
          KHONE_CONFIG_URI: !GetAtt GatewayService.ConfigS3Uri
          KHONE_OBSERVABILITY_VENDOR: !If [OtelEnabled, AWSXRAY, !Ref AWS::NoValue]
          OTEL_PROPAGATORS: !If [OtelEnabled, "xray,tracecontext,baggage", !Ref AWS::NoValue]
          OTEL_METRICS_EXPORTER: !If [OtelEnabled, "none", !Ref AWS::NoValue]
          OTEL_SERVICE_NAME: !If [OtelEnabled, !Sub '${AWS::StackName}-gateway', !Ref AWS::NoValue]
          OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: !If [OtelEnabled, !Ref OtelTracesEndpoint, !Ref AWS::NoValue]
          OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: !If [OtelEnabled, !Ref OtelTracesProtocol, !Ref AWS::NoValue]
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Sid: ReadGatewayConfig
              Effect: Allow
              Action: s3:GetObject
              Resource: !Sub
                - 'arn:${AWS::Partition}:s3:::${Bucket}/${Prefix}*'
                - Bucket: !GetAtt GatewayService.BucketName
                  Prefix: !GetAtt GatewayService.Prefix
            - Sid: InvokeTargetLambdas
              Effect: Allow
              Action:
                - lambda:InvokeFunction
                - lambda:InvokeWithResponseStream
              Resource:
                - !GetAtt SampleBufferingSimpleHelloFunction.Arn
                - !GetAtt SampleBufferingDynamicHelloFunction.Arn
                - !GetAtt SampleStreamingSimpleHelloFunction.Arn
                - !GetAtt SampleStreamingDynamicHelloFunction.Arn
                - !GetAtt SampleBufferingAdapterHelloFunction.Arn
                - !GetAtt SampleStreamingAdapterHelloFunction.Arn
                - !GetAtt SampleStreamingAdapterSseFunction.Arn
                - !GetAtt SampleStreamingModeALayerProxyPythonHelloFunction.Arn
                - !GetAtt SampleStreamingModeALayerProxyNodeHelloFunction.Arn

Outputs:
  SampleBufferingSimpleHelloFunctionArn:
    Value: !GetAtt SampleBufferingSimpleHelloFunction.Arn

  SampleBufferingDynamicHelloFunctionArn:
    Value: !GetAtt SampleBufferingDynamicHelloFunction.Arn

  SampleStreamingSimpleHelloFunctionArn:
    Value: !GetAtt SampleStreamingSimpleHelloFunction.Arn

  SampleStreamingDynamicHelloFunctionArn:
    Value: !GetAtt SampleStreamingDynamicHelloFunction.Arn

  SampleBufferingAdapterHelloFunctionArn:
    Value: !GetAtt SampleBufferingAdapterHelloFunction.Arn

  SampleStreamingAdapterHelloFunctionArn:
    Value: !GetAtt SampleStreamingAdapterHelloFunction.Arn

  SampleStreamingAdapterSseFunctionArn:
    Value: !GetAtt SampleStreamingAdapterSseFunction.Arn

  SampleStreamingModeALayerProxyPythonHelloFunctionArn:
    Value: !GetAtt SampleStreamingModeALayerProxyPythonHelloFunction.Arn

  SampleStreamingModeALayerProxyNodeHelloFunctionArn:
    Value: !GetAtt SampleStreamingModeALayerProxyNodeHelloFunction.Arn

  GatewayFunctionUrl:
    Value: !GetAtt GatewayFunctionUrl.FunctionUrl

  GatewayServiceConfigS3Uri:
    Value: !GetAtt GatewayService.ConfigS3Uri

  BufferingSimpleHelloUrl:
    Value: !Sub "${GatewayFunctionUrl.FunctionUrl}buffering/simple/hello"

  BufferingDynamicHelloUrl:
    Value: !Sub "${GatewayFunctionUrl.FunctionUrl}buffering/dynamic/hello"

  BufferingDurationHelloUrl:
    Value: !Sub "${GatewayFunctionUrl.FunctionUrl}buffering/duration/hello"

  StreamingSimpleHelloUrl:
    Value: !Sub "${GatewayFunctionUrl.FunctionUrl}streaming/simple/hello"

  StreamingDynamicHelloUrl:
    Value: !Sub "${GatewayFunctionUrl.FunctionUrl}streaming/dynamic/hello"

  BufferingAdapterHelloUrl:
    Value: !Sub "${GatewayFunctionUrl.FunctionUrl}buffering/adapter/hello"

  StreamingAdapterHelloUrl:
    Value: !Sub "${GatewayFunctionUrl.FunctionUrl}streaming/adapter/hello"

  StreamingAdapterSseUrl:
    Value: !Sub "${GatewayFunctionUrl.FunctionUrl}streaming/adapter/sse"

  StreamingModeALayerProxyPythonHelloUrl:
    Value: !Sub "${GatewayFunctionUrl.FunctionUrl}streaming/mode-a/python/hello"

  StreamingModeALayerProxyNodeHelloUrl:
    Value: !Sub "${GatewayFunctionUrl.FunctionUrl}streaming/mode-a/node/hello"
